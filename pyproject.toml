[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line-too-long (handled by formatter / line-length)
    "B008",  # do not perform function calls in argument defaults
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon)
    "E402",  # module level import not at top of file
    "F841",  # local variable is assigned to but never used
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
pythonpath = [
    "."
]
markers = [
    "spark: tests requiring active PySpark / Java cluster runtime",
    "slow: tests taking > 5s to run",
    "e2e: end-to-end multi-stage pipeline scenario tests",
]

[tool.coverage.run]
source = ["common", "contracts", "streaming", "linkanalysis", "capture", "ingestion"]
omit = ["tests/*", "scripts/*", "dashboard/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70

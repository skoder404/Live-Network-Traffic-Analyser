# LNTA Flume agent: one capture stream is replicated to historical and live zones.
# Run with: flume-ng agent --conf-file ingestion/flume/lnta-agent.conf --name lnta

lnta.sources = capture
lnta.channels = durable memory
lnta.sinks = historical live
lnta.source.capture.type = TAILDIR
lnta.source.capture.positionFile = /tmp/lnta-taildir.json
lnta.source.capture.filegroups = capture
lnta.source.capture.filegroups.capture = /var/lib/lnta/capture/*.csv
lnta.source.capture.headers.capture_source = tshark
lnta.source.capture.channels = durable memory
lnta.source.capture.selector.type = replicating

lnta.channels.durable.type = file
lnta.channels.durable.checkpointDir = /var/lib/lnta/flume/checkpoint
lnta.channels.durable.dataDirs = /var/lib/lnta/flume/data
lnta.channels.durable.capacity = 100000
lnta.channels.durable.transactionCapacity = 1000
lnta.channels.memory.type = memory
lnta.channels.memory.capacity = 10000
lnta.channels.memory.transactionCapacity = 1000

lnta.sinks.historical.type = hdfs
lnta.sinks.historical.channel = durable
lnta.sinks.historical.hdfs.path = hdfs://localhost:9000/traffic/raw/%Y/%m/%d/%H
lnta.sinks.historical.hdfs.filePrefix = traffic-
lnta.sinks.historical.hdfs.fileSuffix = .csv
lnta.sinks.historical.hdfs.inUsePrefix = .inprogress-
lnta.sinks.historical.hdfs.fileType = DataStream
lnta.sinks.historical.hdfs.writeFormat = Text
lnta.sinks.historical.hdfs.rollInterval = 60
lnta.sinks.historical.hdfs.rollSize = 134217728
lnta.sinks.historical.hdfs.rollCount = 0
lnta.sinks.historical.hdfs.batchSize = 1000
lnta.sinks.historical.hdfs.useLocalTimeStamp = false

lnta.sinks.live.type = hdfs
lnta.sinks.live.channel = memory
lnta.sinks.live.hdfs.path = hdfs://localhost:9000/traffic/stream_in/%Y/%m/%d/%H
lnta.sinks.live.hdfs.filePrefix = traffic-
lnta.sinks.live.hdfs.fileSuffix = .csv
lnta.sinks.live.hdfs.inUsePrefix = .inprogress-
lnta.sinks.live.hdfs.fileType = DataStream
lnta.sinks.live.hdfs.writeFormat = Text
lnta.sinks.live.hdfs.rollInterval = 10
lnta.sinks.live.hdfs.rollSize = 67108864
lnta.sinks.live.hdfs.rollCount = 0
lnta.sinks.live.hdfs.batchSize = 1000
lnta.sinks.live.hdfs.useLocalTimeStamp = false